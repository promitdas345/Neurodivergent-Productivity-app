[pytest]
testpaths = tests
pythonpath = .
# A DeprecationWarning attributed to an app module fails the suite; one from a
# library does not. \b stops "app" matching libraries such as appdirs. Pydantic
# attributes most of its own deprecations (.dict(), .json() ...) to itself, so
# those pass even when app code makes the call.
filterwarnings =
    error::DeprecationWarning:app\b
